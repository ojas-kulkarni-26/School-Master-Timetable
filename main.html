  <script>
// ============================================================
// views.js — Rendering functions for all 5 views
// ============================================================

window._changes = [];

const Views = {
  currentView: 'master',
  currentClassFilter: null,
  currentTeacherFilter: null,
  currentDayFilter: null,

  renderMaster(timetable) {
    const container = document.getElementById('view-content');
    let html = '<div class="master-controls">';
    html += '<label>Grade Filter: </label>';
    html += '<select id="grade-filter" onchange="Views.applyGradeFilter()">';
    html += '<option value="all">All Grades</option>';
    for (let g = 1; g <= 12; g++) {
      html += `<option value="${g}">${g}${g === 1 ? 'st' : g === 2 ? 'nd' : g === 3 ? 'rd' : 'th'}</option>`;
    }
    html += '</select></div>';

    html += '<div class="timetable-scroll">';
    html += '<table class="timetable master-table">';

    const gradeFilter = document.getElementById('grade-filter')?.value || 'all';
    let classes = CLASSES;
    if (gradeFilter !== 'all') {
      classes = CLASSES.filter(c => c.grade === parseInt(gradeFilter));
    }

    // Header row
    html += '<thead><tr><th>Day</th><th>Time</th>';
    classes.forEach(c => {
      const label = c.division ? `${c.name} ${c.division}` : c.name;
      html += `<th class="class-header">${label}</th>`;
    });
    html += '</tr></thead>';

    // Body
    html += '<tbody>';
    DAYS.forEach(day => {
      const maxPeriods = Math.max(...classes.map(c =>
        day === 'Saturday' ? this.getSaturdayPeriodCount(c.id) : this.getWeekdayPeriodCount(c.id)
      ));

      const periods = day === 'Saturday' ? PERIODS_3_10_SAT : PERIODS_3_10;

      for (let pi = 0; pi < maxPeriods; pi++) {
        const period = periods[pi];
        if (!period) continue;

        html += '<tr>';
        if (pi === 0) {
          html += `<td class="day-cell" rowspan="${maxPeriods}">${day}</td>`;
        }
        html += `<td class="time-cell">${period.start}–${period.end}</td>`;

        classes.forEach(c => {
          const cellPeriods = day === 'Saturday' ? this.getSaturdayPeriodIds(c.id) : this.getWeekdayPeriodIds(c.id);
          const pid = cellPeriods[pi];

          if (!pid) {
            html += '<td class="empty-cell"></td>';
            return;
          }

          const entry = timetable[c.id]?.[day]?.[pid];
          if (entry) {
            const tags = formatTags(entry.tags);
            const teacher = entry.teacher ? getTeacherById(entry.teacher)?.name : '';
            const altTeachers = entry.altTeachers ? entry.altTeachers.map(id => getTeacherById(id)?.name || id).join(', ') : '';
            const isMPT = entry.tags?.includes('mpt');
            const isCT = isClassTeacher(entry.teacher, c.id);
            let cls = 'period-cell';
            if (isMPT) cls += ' mpt-cell';
            if (isCT && pid === 'P1') cls += ' ct-cell';
            if (entry.tags?.includes('revision')) cls += ' revision-cell';
            if (entry.tags?.includes('test')) cls += ' test-cell';
            if (entry.tags?.includes('practical')) cls += ' practical-cell';
            if (entry.tags?.includes('combined')) cls += ' combined-cell';
            if (entry.tags?.includes('extra')) cls += ' extra-cell';

            const tagStr = tags ? `<span class="tag">${tags}</span>` : '';
            const noteStr = entry.note ? `<span class="note">${entry.note}</span>` : '';
            html += `<td class="${cls}">
              <div class="subject">${entry.subject}</div>
              <div class="teacher">${teacher}${altTeachers ? '<br>' + altTeachers : ''}</div>
              ${tagStr}${noteStr}
            </td>`;
          } else {
            html += '<td class="empty-cell">—</td>';
          }
        });

        html += '</tr>';
      }
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;
  },

  renderTeacherView(timetable) {
    const container = document.getElementById('view-content');
    let html = '<div class="view-controls">';
    html += '<label>Select Teacher: </label>';
    html += '<select id="teacher-select" onchange="Views.renderTeacherView(window._tt)">';
    html += '<option value="">-- Choose --</option>';
    TEACHERS.forEach(t => {
      html += `<option value="${t.id}" ${this.currentTeacherFilter === t.id ? 'selected' : ''}>${t.name}</option>`;
    });
    html += '</select></div>';

    const teacherId = this.currentTeacherFilter || document.getElementById('teacher-select')?.value;
    if (!teacherId) {
      container.innerHTML = html + '<p>Select a teacher to view their schedule.</p>';
      return;
    }

    const teacher = getTeacherById(teacherId);
    html += `<h3>${teacher.name} — Weekly Schedule</h3>`;

    // Get all classes this teacher teaches
    const teacherClasses = getTeacherClasses(teacherId);

    html += '<table class="timetable teacher-table">';
    html += '<thead><tr><th>Day</th><th>Period</th><th>Time</th><th>Class</th><th>Subject</th><th>Tags</th></tr></thead>';
    html += '<tbody>';

    let totalSessions = 0;
    DAYS.forEach(day => {
      const periods = day === 'Saturday' ? PERIODS_3_10_SAT : PERIODS_3_10;
      let dayStart = true;

      teacherClasses.forEach(cid => {
        const cls = getClassById(cid);
        const dayPeriods = day === 'Saturday' ? this.getSaturdayPeriodIds(cid) : this.getWeekdayPeriodIds(cid);

        dayPeriods.forEach((pid, pi) => {
          const entry = timetable[cid]?.[day]?.[pid];
          if (entry && entry.teacher === teacherId) {
            totalSessions++;
            const period = periods[pi] || periods.find(p => p.id === pid);
            const classLabel = cls.division ? `${cls.name} ${cls.division}` : cls.name;
            const tags = formatTags(entry.tags);
            const tagClass = entry.tags?.includes('extra') ? 'extra-cell' : '';

            html += `<tr class="${tagClass}">`;
            html += `<td>${dayStart ? day : ''}</td>`;
            html += `<td>${pid}</td>`;
            html += `<td>${period ? period.start + '–' + period.end : ''}</td>`;
            html += `<td>${classLabel}</td>`;
            html += `<td>${entry.subject}</td>`;
            html += `<td>${tags}</td>`;
            html += '</tr>';
            dayStart = false;
          }
        });
      });
    });

    html += '</tbody></table>';
    html += `<p><strong>Total Sessions:</strong> ${totalSessions} / ${getTeacherSessionTarget(teacherId)}</p>`;

    container.innerHTML = html;
  },

  renderFreeView(timetable) {
    const container = document.getElementById('view-content');
    let html = '<div class="view-controls">';
    html += '<label>Select Day: </label>';
    html += '<select id="day-select" onchange="Views.renderFreeView(window._tt)">';
    DAYS.forEach(d => {
      html += `<option value="${d}" ${this.currentDayFilter === d ? 'selected' : ''}>${d}</option>`;
    });
    html += '</select></div>';

    const day = this.currentDayFilter || document.getElementById('day-select')?.value || 'Monday';
    const periods = day === 'Saturday' ? PERIODS_3_10_SAT : PERIODS_3_10;

    html += `<h3>Free Teachers on ${day}</h3>`;
    html += '<table class="timetable free-table">';
    html += '<thead><tr><th>Period</th><th>Time</th><th>Free Teachers</th></tr></thead>';
    html += '<tbody>';

    periods.forEach(period => {
      const busyTeachers = new Set();
      CLASSES.forEach(cls => {
        const entry = timetable[cls.id]?.[day]?.[period.id];
        if (entry && entry.teacher) {
          busyTeachers.add(entry.teacher);
        }
      });

      const freeTeachers = TEACHERS.filter(t => {
        if (t.dayRestrictions && !t.dayRestrictions.includes(day)) return false;
        return !busyTeachers.has(t.id);
      });

      html += `<tr>
        <td class="period-label">${period.id}</td>
        <td class="time-cell">${period.start}–${period.end}</td>
        <td class="free-cell">${freeTeachers.map(t => t.name).join(', ') || 'None'}</td>
      </tr>`;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  },

  renderSubjectSummary(timetable) {
    const container = document.getElementById('view-content');
    let html = '<h3>Subject Session Summary</h3>';

    // Collect all subjects
    const allSubjects = new Set();
    CLASSES.forEach(cls => {
      Object.keys(getSubjectsForClass(cls.id)).forEach(s => allSubjects.add(s));
    });

    html += '<table class="timetable summary-master">';
    html += '<thead><tr><th>Subject</th>';
    CLASSES.forEach(c => {
      const label = c.division ? `${c.name}${c.division}` : c.name;
      html += `<th>${label}</th>`;
    });
    html += '<th>Total</th></tr></thead><tbody>';

    [...allSubjects].sort().forEach(subj => {
      html += `<tr><td class="subject-label">${subj}</td>`;
      let grandTotal = 0;
      CLASSES.forEach(cls => {
        const needed = getSessionsRequired(cls.id, subj);
        const done = this.countSubjectInTimetable(cls.id, subj, timetable);
        grandTotal += done;
        if (needed > 0) {
          const cls2 = done >= needed ? 'ok' : (done > 0 ? 'short' : 'missing');
          html += `<td class="${cls2}">${done}/${needed}</td>`;
        } else {
          html += '<td class="na">—</td>';
        }
      });
      html += `<td class="total">${grandTotal}</td></tr>`;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  },

  renderTeacherSummary(timetable) {
    const container = document.getElementById('view-content');
    let html = '<h3>Teacher Session Summary</h3>';
    html += '<table class="timetable teacher-summary-table">';
    html += '<thead><tr><th>#</th><th>Teacher</th><th>Grades (Lectures)</th><th>Total Sessions</th></tr></thead><tbody>';

    TEACHERS.forEach((t, idx) => {
      const classCounts = [];
      const seen = new Set(); // (day,pid) across all classes to de-duplicate
      let total = 0;

      CLASSES.forEach(cls => {
        let count = 0;
        DAYS.forEach(day => {
          const periodIds = day === 'Saturday'
            ? this.getSaturdayPeriodIds(cls.id)
            : this.getWeekdayPeriodIds(cls.id);
          periodIds.forEach(pid => {
            const e = timetable[cls.id]?.[day]?.[pid];
            if (!e) return;
            const isTeacher = e.teacher === t.id;
            const isAlt = e.altTeachers && e.altTeachers.includes(t.id);
            if (isTeacher || isAlt) {
              count++;
              const key = day + '|' + pid;
              if (!seen.has(key)) {
                seen.add(key);
                total++;
              }
            }
          });
        });
        if (count > 0) {
          const label = cls.division ? `${cls.name}${cls.division}` : cls.name;
          classCounts.push(`${label}(${count}lec)`);
        }
      });

      const gradesStr = classCounts.join(', ');
      html += `<tr>
        <td class="num">${idx + 1}</td>
        <td class="teacher-name">${t.name}</td>
        <td class="grades-cell">${gradesStr}</td>
        <td class="num total-cell">${total}</td>
      </tr>`;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  },

  // ---- Helpers ----
  getWeekdayPeriodCount(classId) {
    const cls = getClassById(classId);
    return cls ? cls.periodsWeekday : 6;
  },

  getSaturdayPeriodCount(classId) {
    const cls = getClassById(classId);
    return cls ? cls.periodsSat : 5;
  },

  getWeekdayPeriodIds(classId) {
    const cls = getClassById(classId);
    if (!cls) return [];
    if (cls.group === '3-10') return PERIODS_3_10.map(p => p.id);
    return PERIODS_1_2_11_12.slice(0, cls.periodsWeekday).map(p => p.id);
  },

  getSaturdayPeriodIds(classId) {
    const cls = getClassById(classId);
    if (!cls) return [];
    if (cls.group === '3-10') return PERIODS_3_10_SAT.map(p => p.id);
    if (cls.group === '1-2') return PERIODS_1_2_SAT.map(p => p.id);
    if (cls.group === '11-12') return PERIODS_11_12_SAT.map(p => p.id);
    return [];
  },

  getSaturdayPeriodList(classId) {
    const cls = getClassById(classId);
    if (!cls) return [];
    if (cls.group === '3-10') return PERIODS_3_10_SAT;
    if (cls.group === '1-2') return PERIODS_1_2_SAT;
    if (cls.group === '11-12') return PERIODS_11_12_SAT;
    return [];
  },

  countSubjectInTimetable(classId, subject, timetable) {
    let count = 0;
    DAYS.forEach(day => {
      const periods = day === 'Saturday' ? this.getSaturdayPeriodIds(classId) : this.getWeekdayPeriodIds(classId);
      periods.forEach(pid => {
        const entry = timetable[classId]?.[day]?.[pid];
        if (entry && entry.subject === subject) count++;
      });
    });
    return count;
  },

  applyGradeFilter() {
    this.renderMaster(window._tt);
  },

  // ---- Interactive Teacher Reassignment ----
  _swapOverlay: null,

  renderClassView(timetable) {
    const container = document.getElementById('view-content');

    const dropdownVal = document.getElementById('class-select')?.value;
    const classId = dropdownVal || this.currentClassFilter || '';
    if (classId) this.currentClassFilter = classId;

    let html = '<div class="view-controls">';
    html += '<label>Select Class: </label>';
    html += '<select id="class-select" onchange="Views.renderClassView(window._tt)">';
    html += '<option value="">-- Choose --</option>';
    CLASSES.forEach(c => {
      const label = c.division ? `${c.name} ${c.division}` : c.name;
      html += `<option value="${c.id}" ${this.currentClassFilter === c.id ? 'selected' : ''}>${label}</option>`;
    });
    html += '</select>';

    // Subject highlight dropdown
    if (classId) {
      const subjects = Object.keys(getSubjectsForClass(classId)).filter(s =>
        Object.keys(timetable[classId] || {}).some(day =>
          Object.values(timetable[classId][day] || {}).some(e => e && e.subject === s)
        )
      );
      html += ' <label>Subject: </label>';
      html += '<select id="swap-subject-select" onchange="Views.renderClassView(window._tt)">';
      html += '<option value="">-- None --</option>';
      subjects.forEach(s => {
        html += `<option value="${s}" ${this._swapSubject === s ? 'selected' : ''}>${s}</option>`;
      });
      html += '</select>';
      this._swapSubject = document.getElementById('swap-subject-select')?.value || '';
    }
    html += '</div>';

    if (!classId) {
      container.innerHTML = html + '<p>Select a class to view its timetable.</p>';
      return;
    }

    // Compute highlight cells: periods where the selected subject's teacher is free
    let highlightCells = new Set();
    if (this._swapSubject) {
      const teacherIds = new Set();
      DAYS.forEach(day => {
        const periodIds = day === 'Saturday' ? this.getSaturdayPeriodIds(classId) : this.getWeekdayPeriodIds(classId);
        periodIds.forEach(pid => {
          const e = timetable[classId]?.[day]?.[pid];
          if (e && e.subject === this._swapSubject && e.teacher) {
            teacherIds.add(e.teacher);
          }
        });
      });
      teacherIds.forEach(tid => {
        DAYS.forEach(day => {
          const periodIds = day === 'Saturday' ? this.getSaturdayPeriodIds(classId) : this.getWeekdayPeriodIds(classId);
          periodIds.forEach(pid => {
            const e = timetable[classId]?.[day]?.[pid];
            if (e && e.subject === this._swapSubject) return;
            if (this.isTeacherFreeAt(timetable, tid, day, pid, classId)) {
              highlightCells.add(day + '|' + pid);
            }
          });
        });
      });
    }

    const cls = getClassById(classId);
    const periods = cls.group === '3-10' ? PERIODS_3_10 : PERIODS_1_2_11_12;
    const satPeriods = day => day === 'Saturday' ? this.getSaturdayPeriodList(classId) : periods;

    html += `<h3>${cls.name}${cls.division ? ' ' + cls.division : ''} — Weekly Timetable</h3>`;
    html += '<p class="swap-hint">Click a cell to see free teachers available for that time slot.</p>';
    html += '<table class="timetable class-table" id="class-timetable">';
    html += '<thead><tr><th>Period</th><th>Time</th>';
    DAYS.forEach(d => html += `<th>${d}</th>`);
    html += '</tr></thead><tbody>';

    const maxP = Math.max(...DAYS.map(d => satPeriods(d).length));

    for (let pi = 0; pi < maxP; pi++) {
      html += '<tr>';
      const refPeriods = periods;
      if (pi < refPeriods.length) {
        html += `<td class="period-label">${refPeriods[pi].id}</td>`;
        html += `<td class="time-cell">${refPeriods[pi].start}–${refPeriods[pi].end}</td>`;
      } else {
        html += `<td class="period-label">P${pi + 1}</td>`;
        html += '<td class="time-cell"></td>';
      }

      DAYS.forEach(day => {
        const dayPeriods = satPeriods(day);
        const pid = dayPeriods[pi]?.id || `P${pi + 1}`;
        const entry = timetable[classId]?.[day]?.[pid];
        const isHighlighted = this._swapSubject && highlightCells.has(day + '|' + pid);

        if (entry) {
          const tags = formatTags(entry.tags);
          const teacher = entry.teacher ? getTeacherById(entry.teacher)?.name : '';
          const altTeachers = entry.altTeachers ? entry.altTeachers.map(id => getTeacherById(id)?.name || id).join(', ') : '';
          let cls2 = 'period-cell clickable-cell';
          if (entry.tags?.includes('mpt')) cls2 += ' mpt-cell';
          if (entry.tags?.includes('revision')) cls2 += ' revision-cell';
          if (entry.tags?.includes('test')) cls2 += ' test-cell';
          if (entry.tags?.includes('practical')) cls2 += ' practical-cell';
          if (entry.tags?.includes('combined')) cls2 += ' combined-cell';
          if (entry.tags?.includes('extra')) cls2 += ' extra-cell';
          if (isHighlighted) cls2 += ' subject-highlight-cell';

          const tagStr = tags ? `<span class="tag">${tags}</span>` : '';
          html += `<td class="${cls2}" onclick="Views.showTeacherSwapModal(window._tt, '${classId}', '${day}', '${pid}')">
            <div class="subject">${entry.subject}</div>
            <div class="teacher">${teacher}${altTeachers ? '<br>' + altTeachers : ''}</div>
            ${tagStr}
          </td>`;
        } else {
          html += '<td class="empty-cell">—</td>';
        }
      });
      html += '</tr>';
    }

    html += '</tbody></table>';

    // Session summary
    html += '<h4>Session Summary <span class="summary-ts">' + new Date().toLocaleTimeString() + '</span></h4>';
    html += '<table class="summary-table"><thead><tr><th>Subject</th><th>Required</th><th>Scheduled</th><th>Status</th></tr></thead><tbody>';
    const needed = getSubjectsForClass(classId);
    Object.keys(needed).forEach(subj => {
      const req = needed[subj];
      const done = timetable[classId] ? this.countSubjectInTimetable(classId, subj, timetable) : 0;
      const status = done >= req ? '✓' : `Short ${req - done}`;
      const cls3 = done >= req ? 'ok' : 'short';
      html += `<tr><td>${subj}</td><td>${req}</td><td>${done}</td><td class="${cls3}">${status}</td></tr>`;
    });
    html += '</tbody></table>';

    container.innerHTML = html;

    this.closeTeacherSwapModal();
  },

  findFreeTeachers(timetable, classId, day, pid) {
    const entry = timetable[classId]?.[day]?.[pid];
    if (!entry) return { teachesClass: [], other: [] };

    const currentTeacherId = entry.teacher;
    const currentSubject = entry.subject;
    const teachesClass = [];
    const other = [];

    TEACHERS.forEach(t => {
      if (t.id === currentTeacherId) return;
      if (this.isTeacherFreeAt(timetable, t.id, day, pid, classId)) {
        // Find subjects this teacher can teach for this class
        const subjects = t.assignments
          .filter(a => a.classIds.includes(classId))
          .map(a => a.subject);

        const teaches = subjects.length > 0;
        const target = teaches ? teachesClass : other;

        if (teaches) {
          // One entry per subject the teacher can teach
          subjects.forEach(subject => {
            target.push({ teacher: t, subject });
          });
        } else {
          // Teacher doesn't teach this class — just show teacher name
          target.push({ teacher: t, subject: null });
        }
      }
    });

    return { teachesClass, other };
  },

  showTeacherSwapModal(timetable, classId, day, pid) {
    this.closeTeacherSwapModal();

    const entry = timetable[classId]?.[day]?.[pid];
    if (!entry) return;

    const overlay = document.createElement('div');
    overlay.className = 'swap-overlay';
    overlay.id = 'swap-overlay';
    overlay.innerHTML = `
      <div class="swap-modal">
        <div class="swap-header">
          <h3>${entry.subject} at ${day} ${pid}</h3>
          <span>Current: ${getTeacherById(entry.teacher)?.name || entry.teacher}</span>
          <button class="swap-close-btn" onclick="Views.closeTeacherSwapModal()">✕</button>
        </div>
        <div class="swap-body" id="swap-candidates">
          Loading...
        </div>
      </div>
    `;

    document.body.appendChild(overlay);
    this._swapOverlay = overlay;
    this._swapClassId = classId;
    this._swapDay = day;
    this._swapPid = pid;

    this.renderTeacherSwapCandidates(timetable, classId, day, pid);
  },

  renderTeacherSwapCandidates(timetable, classId, day, pid) {
    const container = document.getElementById('swap-candidates');
    if (!container) return;

    const { teachesClass, other } = this.findFreeTeachers(timetable, classId, day, pid);

    if (teachesClass.length === 0 && other.length === 0) {
      container.innerHTML = '<p class="swap-no-candidates">No free teachers available at this time slot.</p>';
      return;
    }

    let html = '';
    if (teachesClass.length > 0) {
      html += '<h4 style="margin:6px 0 4px;font-size:13px;color:#2c3e50;">Teachers who teach this class</h4>';
      html += '<div class="swap-candidate-list" style="margin-bottom:10px;">';
      teachesClass.forEach(t => {
        const name = getTeacherById(t.teacher.id)?.name || t.teacher.id;
        html += `<div class="swap-candidate" onclick="Views.reassignTeacher(window._tt, '${classId}', '${day}', '${pid}', '${t.teacher.id}', '${t.subject}')">
          <span class="swap-candidate-period">${name}</span>
          <span class="swap-candidate-subject">${t.subject}</span>
        </div>`;
      });
      html += '</div>';
    }

    if (other.length > 0) {
      html += '<h4 style="margin:6px 0 4px;font-size:13px;color:#7f8c8d;">Other free teachers</h4>';
      html += '<div class="swap-candidate-list">';
      other.forEach(t => {
        const name = getTeacherById(t.teacher.id)?.name || t.teacher.id;
        html += `<div class="swap-candidate" onclick="Views.reassignTeacher(window._tt, '${classId}', '${day}', '${pid}', '${t.teacher.id}', null)" style="opacity:0.7;">
          <span class="swap-candidate-period">${name}</span>
          <span class="swap-candidate-subject">(doesn't teach this class)</span>
        </div>`;
      });
      html += '</div>';
    }

    container.innerHTML = html;
  },

  isTeacherFreeAt(timetable, teacherId, day, pid, excludeClassId) {
    for (const cid of Object.keys(timetable)) {
      if (excludeClassId && cid === excludeClassId) continue;
      const e = timetable[cid]?.[day]?.[pid];
      if (e && e.teacher === teacherId) return false;
    }
    return true;
  },

  reassignTeacher(timetable, classId, day, pid, newTeacherId, newSubject) {
    const entry = timetable[classId]?.[day]?.[pid];
    if (!entry) return;

    window._changes.push({
      classId: classId,
      day: day,
      pid: pid,
      oldTeacher: entry.teacher,
      oldSubject: entry.subject,
      newTeacher: newTeacherId,
      newSubject: newSubject || entry.subject
    });

    entry.teacher = newTeacherId;
    if (newSubject) entry.subject = newSubject;

    this.saveState();

    this.closeTeacherSwapModal();
    this.renderClassView(timetable);
  },

  // ---- State Export/Import ----
  saveState() {
    const seed = document.getElementById('seed-input')?.value || 'default';
    const str = this.encodeState(seed, window._changes);
    try { localStorage.setItem('timetable_state', str); } catch(e) {}
  },

  encodeState(seed, changes) {
    return seed + '|' + changes.map(c =>
      c.classId + ':' + c.day + ':' + c.pid + ':' + c.newTeacher + ':' + encodeURIComponent(c.newSubject)
    ).join(',');
  },

  decodeState(str) {
    const idx = str.indexOf('|');
    if (idx === -1) return null;
    const seed = str.slice(0, idx);
    const changes = str.slice(idx + 1).split(',').filter(Boolean).map(c => {
      const [classId, day, pid, newTeacher, newSubject] = c.split(':');
      return { classId, day, pid, newTeacher, newSubject: decodeURIComponent(newSubject) };
    });
    return { seed, changes };
  },

  applyChanges(timetable, changes) {
    if (!changes || changes.length === 0) return;
    changes.forEach(c => {
      const entry = timetable[c.classId]?.[c.day]?.[c.pid];
      if (entry) {
        entry.teacher = c.newTeacher;
        if (c.newSubject) entry.subject = c.newSubject;
      }
    });
  },

  getExportString() {
    const seed = document.getElementById('seed-input')?.value || 'default';
    return this.encodeState(seed, window._changes);
  },

  closeTeacherSwapModal() {
    const overlay = document.getElementById('swap-overlay');
    if (overlay) {
      overlay.remove();
    }
    this._swapClassId = null;
    this._swapDay = null;
    this._swapPid = null;
  }
};

// ============================================================
// csv.js — CSV Export with tags
// ============================================================

const CSV = {
  export(timetable) {
    const rows = [['Class', 'Division', 'Day', 'Period', 'Time', 'Subject', 'Teacher', 'Tags']];

    CLASSES.forEach(cls => {
      DAYS.forEach(day => {
        const periods = day === 'Saturday'
          ? this.getSaturdayPeriods(cls.id)
          : this.getWeekdayPeriods(cls.id);

        periods.forEach(period => {
          const entry = timetable[cls.id]?.[day]?.[period.id];
          if (!entry) return;

          const teacherName = entry.teacher ? (getTeacherById(entry.teacher)?.name || '') : '';
          const altNames = entry.altTeachers ? entry.altTeachers.map(id => getTeacherById(id)?.name || id).join(' / ') : '';
          const teacherStr = altNames ? teacherName + ' / ' + altNames : teacherName;
          const tags = this.formatTagsForCSV(entry.tags);
          const division = cls.division || '';

          rows.push([
            cls.name,
            division,
            day,
            period.id,
            `${period.start}–${period.end}`,
            entry.subject,
            teacherStr,
            tags
          ]);
        });
      });
    });

    const csv = this.toCSVString(rows);
    this.download(csv, 'timetable.csv');
  },

  formatTagsForCSV(tags) {
    if (!tags || tags.length === 0) return '';
    return tags.map(t => {
      switch (t) {
        case 'extra': return '[E]';
        case 'combined': return '[C]';
        case 'test': return '[T]';
        case 'practical': return '[P]';
        case 'revision': return '[R]';
        case 'mpt': return '[MPT]';
        default:
          if (t.startsWith('combined:')) return '[C]';
          return '';
      }
    }).filter(Boolean).join(' ');
  },

  toCSVString(rows) {
    return rows.map(row =>
      row.map(cell => {
        const s = String(cell);
        if (s.includes(',') || s.includes('"') || s.includes('\n')) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }).join(',')
    ).join('\n');
  },

  download(csvContent, filename) {
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
  },

  getWeekdayPeriods(classId) {
    const cls = getClassById(classId);
    if (!cls) return [];
    if (cls.group === '3-10') return PERIODS_3_10;
    return PERIODS_1_2_11_12;
  },

  getSaturdayPeriods(classId) {
    const cls = getClassById(classId);
    if (!cls) return [];
    if (cls.group === '3-10') return PERIODS_3_10_SAT;
    if (cls.group === '1-2') return PERIODS_1_2_SAT;
    if (cls.group === '11-12') return PERIODS_11_12_SAT;
    return [];
  }
};

  <script>
// ============================================================
// app.js — Main application initialization and event handlers
// ============================================================

const App = {
  timetable: null,
  isGenerating: false,

  init() {
    const genBtn = document.getElementById('generate-btn');
    const exportBtn = document.getElementById('export-btn');
    const seedInput = document.getElementById('seed-input');

    genBtn.addEventListener('click', () => this.generate());
    exportBtn.addEventListener('click', () => this.exportCSV());

    document.getElementById('export-state-btn').addEventListener('click', () => this.exportState());
    document.getElementById('import-state-btn').addEventListener('click', () => this.importState());
    document.getElementById('clear-state-btn').addEventListener('click', () => this.clearState());

    // Tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        Views.currentView = e.target.dataset.view;
        this.renderCurrentView();
      });
    });

    // Enter key on seed input
    seedInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.generate();
    });

    // Load last seed from localStorage, and check for saved changes
    const lastSeed = localStorage.getItem('timetable_seed');
    if (lastSeed) seedInput.value = lastSeed;
    const savedState = localStorage.getItem('timetable_state');
    if (savedState) {
      const decoded = Views.decodeState(savedState);
      if (decoded) {
        seedInput.value = decoded.seed;
      }
    }
  },

  generate() {
    const seedInput = document.getElementById('seed-input');
    const seed = seedInput.value.trim() || 'default';
    localStorage.setItem('timetable_seed', seed);

    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Generating timetable...';
    statusEl.className = 'status generating';

    this.isGenerating = true;
    document.getElementById('generate-btn').disabled = true;

    // Use setTimeout to allow UI to update
    setTimeout(() => {
      try {
        const solver = new TimetableSolver(seed);
        const result = solver.solve();
        this.timetable = result.timetable;
        window._tt = result.timetable;

        // Apply saved changes if they match the current seed
        const savedState = localStorage.getItem('timetable_state');
        if (savedState) {
          const decoded = Views.decodeState(savedState);
          if (decoded && decoded.seed === seed && decoded.changes.length > 0) {
            Views.applyChanges(this.timetable, decoded.changes);
            window._changes = decoded.changes;
          }
        }

        let statusMsg = 'Timetable generated successfully!';
        if (result.warnings.length > 0) {
          statusMsg += ` (${result.warnings.length} warnings)`;
        }
        if (result.errors.length > 0) {
          statusMsg += ` (${result.errors.length} errors)`;
        }

        statusEl.textContent = statusMsg;
        statusEl.className = result.errors.length > 0 ? 'status error' : 'status success';

        this.renderCurrentView();
        this.renderWarnings(result.warnings, result.errors);
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'status error';
        console.error(err);
      } finally {
        this.isGenerating = false;
        document.getElementById('generate-btn').disabled = false;
      }
    }, 50);
  },

  renderCurrentView() {
    if (!this.timetable) return;

    switch (Views.currentView) {
      case 'master':
        Views.renderMaster(this.timetable);
        break;
      case 'class':
        Views.renderClassView(this.timetable);
        break;
      case 'teacher':
        Views.renderTeacherView(this.timetable);
        break;
      case 'free':
        Views.renderFreeView(this.timetable);
        break;
      case 'summary':
        Views.renderSubjectSummary(this.timetable);
        break;
      case 'teacher-summary':
        Views.renderTeacherSummary(this.timetable);
        break;
    }
  },

  exportCSV() {
    if (!this.timetable) {
      alert('Generate a timetable first!');
      return;
    }
    CSV.export(this.timetable);
  },

  exportState() {
    if (!this.timetable) {
      alert('Generate a timetable first!');
      return;
    }
    const str = Views.getExportString();
    this.showStateModal(str, 'Export');
  },

  importState() {
    this.showStateModal('', 'Import');
  },

  clearState() {
    if (!confirm('Clear saved state and all changes?')) return;
    window._changes = [];
    localStorage.removeItem('timetable_state');
    document.getElementById('seed-input').value = '';
    alert('State cleared.');
  },

  showStateModal(prefill, mode) {
    const overlay = document.createElement('div');
    overlay.className = 'swap-overlay';
    overlay.id = 'state-overlay';
    const isExport = mode === 'Export';
    overlay.innerHTML = `
      <div class="swap-modal">
        <div class="swap-header">
          <h3>${isExport ? 'Export State' : 'Import State'}</h3>
          <button class="swap-close-btn" onclick="document.getElementById('state-overlay').remove()">✕</button>
        </div>
        <div class="swap-body">
          ${isExport
            ? '<p style="margin-bottom:8px;font-size:12px;color:#555;">Copy this string to transfer your timetable + changes to another device. Paste it in the Import dialog on the target device, then click Generate.</p>'
            : '<p style="margin-bottom:8px;font-size:12px;color:#555;">Paste an exported state string below, then click Generate to recreate the timetable with all changes applied.</p>'
          }
          <textarea id="state-text" style="width:100%;height:100px;padding:8px;font-family:monospace;font-size:11px;border:1px solid #ddd;border-radius:4px;resize:vertical;" ${isExport ? 'readonly' : ''}>${prefill}</textarea>
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end;">
            ${isExport
              ? '<button class="btn btn-primary" onclick="var t=document.getElementById(\'state-text\');t.select();document.execCommand(\'copy\');alert(\'Copied!\')">Copy</button>'
              : '<button class="btn btn-primary" onclick="App.doImport()">Import & Generate</button>'
            }
            <button class="btn btn-secondary" onclick="document.getElementById('state-overlay').remove()">Close</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  },

  doImport() {
    const text = document.getElementById('state-text')?.value;
    if (!text) return;
    const decoded = Views.decodeState(text);
    if (!decoded) {
      alert('Invalid state string.');
      return;
    }
    document.getElementById('state-overlay')?.remove();
    document.getElementById('seed-input').value = decoded.seed;
    localStorage.setItem('timetable_seed', decoded.seed);
    // Store the changes for application on next generate
    localStorage.setItem('timetable_state', text);
    window._changes = decoded.changes;
    this.generate();
  },

  renderWarnings(warnings, errors) {
    const container = document.getElementById('warnings');
    if (!container) return;

    let html = '';
    if (errors.length > 0) {
      html += '<div class="error-block"><h4>Errors:</h4><ul>';
      errors.forEach(e => html += `<li class="error-item">${e}</li>`);
      html += '</ul></div>';
    }
    if (warnings.length > 0) {
      html += '<div class="warning-block"><h4>Warnings:</h4><ul>';
      warnings.forEach(w => html += `<li class="warning-item">${w}</li>`);
      html += '</ul></div>';
    }
    container.innerHTML = html;
  }
};

// Initialize on DOM ready
document.addEventListener('DOMContentLoaded', () => App.init());

</script>
