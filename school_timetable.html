  '12':{English:3,Maths:5,Physics:3,Chemistry:3,Biology:4,'Computer/IT':2,PE:4,MPT:2,PT:2},
};

const SAT_OK=new Set(['English','Hindi','Marathi','Maths','EVS','Science','Physics','Chemistry','Biology','S.St','Computer/IT','PE','Phonics','Speaking Skills','MPT','PT','Kushal Bodh','Khel Yatra','Khel Yoga','Reading Activity']);
const FILL=['Maths','English','Physics','Chemistry','Biology','Science','EVS','S.St','Hindi','Marathi','Computer/IT','PE','Art','Chess','Phonics','Speaking Skills'];

// ── STATE ─────────────────────────────────────────
let SCH={},BUSY={},LOGS=[];

function initState(){
  SCH={};BUSY={};LOGS=[];
  for(const div of DIVS){
    SCH[div.id]={};
    for(let d=0;d<6;d++){
      const ps=getPeriods(div.grp,d===5);
      SCH[div.id][d]=ps.map(p=>({pid:p.id,lb:p.lb,s:p.s,e:p.e,subj:p.isBreak?'__BRK__':p.isRead?'Reading Activity':p.isAct?'__ACT__':null,tch:null,isBreak:!!p.isBreak,isRead:!!p.isRead,isAct:!!p.isAct,isRev:!!p.isRev,isExtra:false}));
    }
  }
}
function getTcher(subj,grade,did){
  if(subj==='MPT')return CT[did]||'ClassTeacher';
  if(subj==='PT')return 'PT Teacher';
  if(subj==='PE'){if(grade===11)return 'Sayali Miss';if(grade===12)return 'Sudarshan Sir';return null}
  const m=TA.find(a=>a.s===subj&&a.g.includes(grade));return m?m.t:null;
}
function getAllowedDays(tch,subj){const m=TA.find(a=>a.t===tch&&a.s===subj);if(!m||!m.days)return[0,1,2,3,4,5];return m.days}
function isFree(t,d,pid){return!BUSY[t]?.[d]?.[pid]}
function markBusy(t,d,pid,did){if(!BUSY[t])BUSY[t]={};if(!BUSY[t][d])BUSY[t][d]={};BUSY[t][d][pid]=did}
function assign(did,d,idx,subj,tch,extra=false){
  SCH[did][d][idx].subj=subj;SCH[did][d][idx].tch=tch;SCH[did][d][idx].isExtra=extra;
  const pid=SCH[did][d][idx].pid;
  if(subj!=='MPT')markBusy(tch,d,pid,did);
}
function freeSlots(did,d){return SCH[did][d].map((s,i)=>({...s,i})).filter(s=>!s.isBreak&&!s.isAct&&!s.isRead&&s.subj===null)}
function cntW(did,subj){let c=0;for(let d=0;d<6;d++)c+=SCH[did][d].filter(s=>s.subj===subj).length;return c}
function cntD(did,d,subj){return SCH[did][d].filter(s=>s.subj===subj).length}

// ── SCHEDULER ────────────────────────────────────
function generate(){
  initState();

  // 1. MPT: Wednesday P1+P2 all divisions
  for(const div of DIVS){
    const d=2,ct=CT[div.id],ps=getPeriods(div.grp,false);
    const i1=ps.findIndex(p=>p.id==='P1'),i2=ps.findIndex(p=>p.id==='P2');
    if(i1>=0)assign(div.id,d,i1,'MPT',ct);
    if(i2>=0)assign(div.id,d,i2,'MPT',ct);
  }

  // 2. Saturday special subjects (class teacher)
  for(const div of DIVS){
    const d=5,ct=CT[div.id];
    if(div.g>=3&&div.g<=5){
      const idx=SCH[div.id][d].findIndex(s=>s.pid==='P2'&&s.subj===null);
      if(idx>=0)assign(div.id,d,idx,'Khel Yoga',ct);
    }
    if(div.g>=6&&div.g<=10){
      const i2=SCH[div.id][d].findIndex(s=>s.pid==='P2'&&s.subj===null);
      const i3=SCH[div.id][d].findIndex(s=>s.pid==='P3'&&s.subj===null);
      if(i2>=0)assign(div.id,d,i2,'Kushal Bodh',ct);
      if(i3>=0)assign(div.id,d,i3,'Khel Yatra',ct);
    }
  }

  // 3. P1 every weekday = class teacher subject
  for(const div of DIVS){
    const ct=CT[div.id];if(!ct)continue;
    const ctS=TA.filter(a=>a.t===ct&&a.g.includes(div.g)&&a.s!=='MPT'&&a.s!=='PT').map(a=>a.s);
    if(!ctS.length)continue;
    for(let d=0;d<5;d++){
      if(d===2)continue;
      const ps=getPeriods(div.grp,false);
      const p1i=ps.findIndex(p=>!p.isBreak&&!p.isAct);
      if(p1i<0)continue;
      const sl=SCH[div.id][d][p1i];if(sl.subj!==null)continue;
      const ranked=[...ctS].sort((a,b)=>cntW(div.id,a)-cntW(div.id,b));
      for(const subj of ranked){
        const need=SESS[div.id]?.[subj]||0;
        if(cntW(div.id,subj)>=need)continue;
        if(cntD(div.id,d,subj)>0)continue;
        const ad=getAllowedDays(ct,subj);if(!ad.includes(d))continue;
        if(isFree(ct,d,sl.pid)){assign(div.id,d,p1i,subj,ct);break}
      }
      if(SCH[div.id][d][p1i].subj===null){
        for(const subj of ranked){
          if(cntW(div.id,subj)>=(SESS[div.id]?.[subj]||0))continue;
          if(isFree(ct,d,sl.pid)){assign(div.id,d,p1i,subj,ct);break}
        }
      }
    }
  }

  // 4. Build task list
  const tDC={};for(const a of TA)tDC[a.t]=(tDC[a.t]||0)+a.g.length;
  let tasks=[];
  for(const div of DIVS){
    for(const [subj,total] of Object.entries(SESS[div.id]||{})){
      if(subj==='MPT'||subj==='PT')continue;
      const tch=getTcher(subj,div.g,div.id);if(!tch)continue;
      tasks.push({did:div.id,g:div.g,subj,tch,total,pri:tDC[tch]||1});
    }
  }
  tasks=shuffleByPri(tasks);

  // 5. Place required sessions
  for(let pass=0;pass<10;pass++){
    let any=false;
    for(const tk of tasks){
      const{did,g,subj,tch,total}=tk;
      if(cntW(did,subj)>=total)continue;
      const ad=getAllowedDays(tch,subj);
      const dord=dayOrd(did,subj,ad);
      let placed=false;
      for(const d of dord){
        if(d===5&&!SAT_OK.has(subj))continue;
        if(!ad.includes(d))continue;
        const mx=total<=6?1:2;if(cntD(did,d,subj)>=mx)continue;
        const fs=freeSlots(did,d);if(!fs.length)continue;
        for(const sl of sortSl(fs,subj)){
          if(isFree(tch,d,sl.pid)){assign(did,d,sl.i,subj,tch);placed=true;any=true;break}
        }
        if(placed)break;
      }
      if(!placed){
        for(let d=0;d<6;d++){
          if(d===5&&!SAT_OK.has(subj))continue;
          if(!ad.includes(d))continue;
          for(const sl of freeSlots(did,d)){
            if(isFree(tch,d,sl.pid)){assign(did,d,sl.i,subj,tch);placed=true;any=true;break}
          }
          if(placed)break;
        }
      }
    }
    if(!any)break;
  }

  // 6. PT: 2 per division, any free, conflict-free
  for(const div of DIVS){
    let done=0;
    for(const d of shuffle([0,1,2,3,4,5])){
      if(done>=2)break;
      for(const sl of shuffle(freeSlots(div.id,d))){
        if(done>=2)break;
        if(isFree('PT Teacher',d,sl.pid)){assign(div.id,d,sl.i,'PT','PT Teacher');done++;break}
      }
    }
  }

  // 7. Fill empty slots (extra)
  for(const div of DIVS){
    for(let d=0;d<6;d++){
      for(const sl of freeSlots(div.id,d)){
        for(const subj of FILL){
          if(d===5&&!SAT_OK.has(subj))continue;
          if(!SESS[div.id]?.[subj])continue;
          const tch=getTcher(subj,div.g,div.id);if(!tch)continue;
          const ad=getAllowedDays(tch,subj);if(!ad.includes(d))continue;
          if(cntD(div.id,d,subj)>=2)continue;
          if(isFree(tch,d,sl.pid)){assign(div.id,d,sl.i,subj,tch,true);break}
        }
      }
    }
  }

  validate();
}

function shuffleByPri(tasks){
  const byP={};for(const t of tasks)(byP[t.pri]=byP[t.pri]||[]).push(t);
  let out=[];for(const p of Object.keys(byP).map(Number).sort((a,b)=>b-a))out=[...out,...shuffle(byP[p])];
  return out;
}
function dayOrd(did,subj,ad){
  const arr=[];
  for(let d=0;d<6;d++){if(!ad.includes(d))continue;arr.push({d,cnt:cntD(did,d,subj),fr:freeSlots(did,d).length})}
  arr.sort((a,b)=>a.cnt-b.cnt||b.fr-a.fr);
  const g={};for(const x of arr)(g[x.cnt]=g[x.cnt]||[]).push(x);
  let out=[];for(const k of Object.keys(g).sort((a,b)=>a-b))out=[...out,...shuffle(g[k])];
  return out.map(x=>x.d);
}
function sortSl(slots,subj){
  const ac=new Set(['Maths','English','Hindi','Marathi','Physics','Chemistry','Biology','Science','EVS','S.St']);
  if(ac.has(subj))return[...slots].sort((a,b)=>a.i-b.i);return shuffle(slots);
}
function validate(){
  LOGS=[];let need=0,done=0,conf=0;
  for(const[tch,days]of Object.entries(BUSY)){
    for(let d=0;d<6;d++){
      if(!days[d])continue;
      const seen={};
      for(const pid of Object.keys(days[d])){if(seen[pid]){LOGS.push({t:'err',m:`CONFLICT: ${tch} ${DAYS[d]} ${pid}`});conf++}seen[pid]=true}
    }
  }
  for(const div of DIVS){
    for(const[subj,n]of Object.entries(SESS[div.id]||{})){
      need+=n;const got=cntW(div.id,subj);done+=Math.min(got,n);
      if(got<n)LOGS.push({t:'warn',m:`${div.n}: ${subj} ${got}/${n}`});
    }
  }
  const pct=Math.round(done/need*100);
  LOGS.unshift({t:'ok',m:`Completeness: ${done}/${need} (${pct}%)`});
  LOGS.unshift(conf===0?{t:'ok',m:'No teacher conflicts ✓'}:{t:'err',m:`${conf} conflict(s) found`});
}

// ── RENDERING ────────────────────────────────────
function cellH(sl){
  if(sl.isBreak)return`<div class="cell cb"><span class="cs">${sl.lb}</span></div>`;
  if(sl.isAct)return`<div class="cell cb"><span class="cs">Activity / Dispersal</span></div>`;
  if(sl.isRead||sl.subj==='Reading Activity')return`<div class="cell" style="background:${SC['Reading Activity']}"><span class="cs">Reading Activity</span><span class="ct2">All — Assembly Hall</span></div>`;
  if(!sl.subj)return`<div class="cell cnil"><span class="cs" style="color:var(--txt3)">—</span></div>`;
  const bg=SC[sl.subj]||'#4a5070';
  return`<div class="cell" style="background:${bg}"><span class="cs">${sl.subj}</span>${sl.tch?`<span class="ct2">${sl.tch}</span>`:''}${sl.isExtra?`<span class="cex">extra</span>`:''}</div>`;
}

let curTab='div';
function switchTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  document.getElementById('ctrlD').style.display=tab==='div'?'flex':'none';
  document.getElementById('ctrlT').style.display=tab==='tch'?'flex':'none';
  tab==='div'?renderDiv():renderTch();
}

function renderDiv(){
  const did=document.getElementById('selDiv').value;
  const dv=document.getElementById('selDay').value;
  const div=DIVS.find(x=>x.id===did);if(!div)return;
  const days=dv==='all'?[0,1,2,3,4,5]:[+dv];
  let html='';
  if(days.length===1){
    const d=days[0];
    html+=`<div class="tw"><table class="tt"><thead><tr><th>Period / Time</th><th class="dh">${DAYS[d]}</th><th>Teacher</th></tr></thead><tbody>`;
    for(const sl of SCH[did][d]){
      const bg=(!sl.isBreak&&!sl.isAct&&sl.subj&&!sl.isRead)?SC[sl.subj]||'#4a5070':'transparent';
      html+=`<tr><td class="pc"><span class="pn">${sl.lb}</span><span class="pt">${sl.s}–${sl.e}</span></td><td>${cellH(sl)}</td><td><div class="cell" style="background:${bg}"><span class="cs" style="font-weight:400;font-size:.74rem;color:rgba(0,0,0,.78)">${(!sl.isBreak&&!sl.isAct&&sl.subj&&!sl.isRead)?(sl.tch||'—'):''}</span></div></td></tr>`;
    }
    html+=`</tbody></table></div>`;
  } else {
    const maxL=Math.max(...days.map(d=>SCH[did][d].length));
    html+=`<div class="tw"><table class="tt"><thead><tr><th>Period</th>${days.map(d=>`<th class="dh">${DAYS[d]}</th>`).join('')}</tr></thead><tbody>`;
    for(let pi=0;pi<maxL;pi++){
      const ref=SCH[did][days[0]][pi]||SCH[did][days[1]]?.[pi];if(!ref)continue;
      html+=`<tr><td class="pc"><span class="pn">${ref.lb}</span><span class="pt">${ref.s}–${ref.e}</span></td>`;
      for(const d of days){const sl=SCH[did][d][pi];html+=`<td>${sl?cellH(sl):'<div class="cell cnil"></div>'}</td>`}
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
  }
  html+=logH();
  document.getElementById('view').innerHTML=`<div class="main">${html}</div>`;
}

function renderTch(){
  const tch=document.getElementById('selTch').value;if(!tch)return;
  const byDay={};const pidT={};let tot=0;const divs=new Set();
  for(let d=0;d<6;d++){byDay[d]={};for(const div of DIVS)for(const sl of SCH[div.id][d])if(sl.tch===tch&&!sl.isBreak){byDay[d][sl.pid]={...sl,dn:div.n};pidT[sl.pid]=sl.s+'–'+sl.e;tot++;divs.add(div.n)}}
  const pids=['P1','P2','P3','P4','P5','P6','P7','P8'],plb={'P1':'1st','P2':'2nd','P3':'3rd','P4':'4th','P5':'5th','P6':'6th','P7':'7th','P8':'8th'};
  let html=`<div class="tsumm"><strong>${tch}</strong><span>${tot} sessions/week</span><span>Classes: ${[...divs].join(', ')}</span><span class="badge">Seed ${_S}</span></div>`;
  html+=`<div class="tw"><table class="tt"><thead><tr><th>Period</th>${DAYS.map(d=>`<th class="dh">${d}</th>`).join('')}</tr></thead><tbody>`;
  for(const pid of pids){
    if(!Object.values(byDay).some(x=>x[pid]))continue;
    html+=`<tr><td class="pc"><span class="pn">${plb[pid]||pid}</span>${pidT[pid]?`<span class="pt">${pidT[pid]}</span>`:''}</td>`;
    for(let d=0;d<6;d++){const sl=byDay[d][pid];if(sl){const bg=SC[sl.subj]||'#4a5070';html+=`<td><div class="cell" style="background:${bg}"><span class="cs">${sl.subj}</span><span class="ct2">${sl.dn}</span>${sl.isExtra?`<span class="cex">extra</span>`:''}</div></td>`}else html+=`<td><div class="cell cnil"><span class="cs" style="color:var(--txt3)">—</span></div></td>`}
    html+=`</tr>`;
  }
  html+=`</tbody></table></div>`;html+=logH();
  document.getElementById('view').innerHTML=`<div class="main">${html}</div>`;
}

function logH(){
  const items=LOGS.slice(0,50);
  return`<div class="log"><div class="lhdr"><span>Schedule Log</span><span style="color:var(--txt3);font-size:.65rem;font-family:'DM Mono',monospace">${items.length} entries</span></div><div class="lbod">${items.map(l=>`<div class="li2 ${l.t}">${l.m}</div>`).join('')}</div></div>`;
}
function renderLegend(){document.getElementById('legend').innerHTML=Object.entries(SC).map(([s,c])=>`<div class="li"><div class="ld" style="background:${c}"></div>${s}</div>`).join('')}
function renderStats(){
  let need=0,done=0,extras=0,conf=0;
  for(const div of DIVS){for(const[s,n]of Object.entries(SESS[div.id]||{})){need+=n;done+=Math.min(cntW(div.id,s),n)}for(let d=0;d<6;d++)extras+=SCH[div.id][d].filter(s=>s.isExtra).length}
  conf=LOGS.filter(l=>l.t==='err'&&l.m.includes('CONFLICT')).length;
  const pct=Math.round(done/need*100);
  document.getElementById('stats').innerHTML=`
    <div class="sv"><div class="svv">${DIVS.length}</div><div class="svl">Divisions</div></div>
    <div class="sv"><div class="svv">${Object.keys(BUSY).length}</div><div class="svl">Teachers</div></div>
    <div class="sv"><div class="svv">${done}</div><div class="svl">Sessions Placed</div></div>
    <div class="sv"><div class="svv ${pct>=95?'ok':''}">${pct}%</div><div class="svl">Completeness</div></div>
    <div class="sv"><div class="svv ${conf===0?'ok':'err'}">${conf}</div><div class="svl">Conflicts</div></div>
    <div class="sv"><div class="svv bl">${extras}</div><div class="svl">Extra Slots</div></div>
    <div class="sv"><div class="svv mo">${_S}</div><div class="svl">Active Seed</div></div>`;
}
function populateSels(){
  document.getElementById('selDiv').innerHTML=DIVS.map(d=>`<option value="${d.id}">${d.n}</option>`).join('');
  const ts=[...new Set(TA.map(a=>a.t))].sort();if(!ts.includes('PT Teacher'))ts.push('PT Teacher');
  document.getElementById('selTch').innerHTML=ts.map(t=>`<option value="${t}">${t}</option>`).join('');
}
function exportCSV(){
  let csv=`School Master Timetable 2026-27\nSeed: ${_S}\n\n`;
  for(const div of DIVS){
    csv+=`\n=== ${div.n} ===\nPeriod,Time,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday\n`;
    const maxL=Math.max(...[0,1,2,3,4,5].map(d=>SCH[div.id][d].length));
    for(let pi=0;pi<maxL;pi++){
      const ref=SCH[div.id][0][pi]||SCH[div.id][1]?.[pi];if(!ref)continue;
      const row=[ref.lb,`${ref.s}-${ref.e}`];
      for(let d=0;d<6;d++){const sl=SCH[div.id][d][pi];if(!sl){row.push('');continue}if(sl.isBreak){row.push(sl.lb);continue}if(sl.isAct){row.push('Activity/Dispersal');continue}row.push(sl.subj?(sl.subj+(sl.tch?' ('+sl.tch+')':''+(sl.isExtra?' [EXTRA]':''))):'');}
      csv+=row.map(c=>`"${(c||'').replace(/"/g,'""')}"`).join(',')+'\n';
    }
  }
  csv+=`\n\n=== TEACHER SCHEDULES ===\n`;
  const allT=[...new Set(TA.map(a=>a.t)),'PT Teacher'];
  for(const t of allT){
    csv+=`\n--- ${t} ---\nDay,Period,Time,Division,Subject,Extra\n`;
    for(let d=0;d<6;d++)for(const div of DIVS)for(const sl of SCH[div.id][d])if(sl.tch===t&&!sl.isBreak)csv+=`"${DAYS[d]}","${sl.lb}","${sl.s}-${sl.e}","${div.n}","${sl.subj||''}","${sl.isExtra?'YES':''}"\n`;
  }
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`TT_seed${_S}_2026-27.csv`;a.click();
}
function regenerate(){
  const sv=parseInt(document.getElementById('seedInp').value)||2627;
  seedRng(sv);generate();populateSels();renderLegend();renderStats();
  curTab==='div'?renderDiv():renderTch();
}
function boot(){
  const bar=document.getElementById('prog');
  const msgs=['Loading teacher data…','Building period slots…','Placing MPT — Wed P1+P2…','Assigning Saturday specials…','Scheduling all sessions…','Placing PT sessions…','Filling extra slots…','Validating schedule…'];
  let pct=0,mi=0;
  const iv=setInterval(()=>{
    pct=Math.min(pct+ri(16)+7,92);bar.style.width=pct+'%';
    if(mi<msgs.length)document.getElementById('lmsg').textContent=msgs[mi++];
    if(pct>=92){clearInterval(iv);setTimeout(()=>{bar.style.width='100%';setTimeout(()=>{
      const sv=parseInt(document.getElementById('seedInp').value)||2627;
      seedRng(sv);generate();populateSels();renderLegend();renderStats();renderDiv();
      document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';
    },200)},150)}
  },155);
}
window.addEventListener('DOMContentLoaded',boot);
</script></body></html>
