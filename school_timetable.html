<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Timetable 2026-27</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a10;
  --surf:#0e1018;
  --surf2:#141720;
  --surf3:#1a1e2c;
  --surf4:#1f2435;
  --bdr:#232840;
  --bdr2:#2d3352;
  --gold:#f0b429;
  --gold2:#ffd166;
  --gold3:#fff3c4;
  --teal:#06d6a0;
  --teal2:#00f5c4;
  --blue:#4a90e2;
  --blue2:#7eb8ff;
  --rose:#ff6b9d;
  --txt:#e8ecf8;
  --txt2:#8a94b8;
  --txt3:#3d4560;
  --ok:#06d6a0;
  --warn:#f0b429;
  --err:#ff4d6d;
  --r:12px;
  --rs:8px;
  --rss:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Instrument Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(240,180,41,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(6,214,160,0.05) 0%, transparent 60%);
}

/* ── LOADER ─────────────────── */
#loading{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;gap:20px;
}
.load-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--gold);letter-spacing:-.03em}
.load-sub{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--txt3);letter-spacing:.18em;text-transform:uppercase}
.pw{width:260px;height:2px;background:var(--surf3);border-radius:1px;overflow:hidden;margin-top:8px}
.pb{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:1px;width:0;transition:width .25s ease}
#lmsg{font-size:.72rem;color:var(--txt2);font-family:'JetBrains Mono',monospace;min-height:1em}

/* ── HEADER ─────────────────── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,10,16,0.94);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  min-height:56px;
}
.brand{display:flex;flex-direction:column;gap:1px}
.brand-name{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--gold);letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:.58rem;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--txt3)}
.hcontrols{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.seed-wrap{
  display:flex;align-items:center;gap:8px;
  background:var(--surf2);
  border:1px solid var(--bdr2);
  border-radius:var(--rs);
  padding:6px 12px;
}
.seed-wrap label{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--txt3);white-space:nowrap}
.seed-wrap input{
  background:transparent;border:none;outline:none;
  color:var(--gold);
  font-family:'JetBrains Mono',monospace;
  font-size:.88rem;font-weight:500;width:76px;
}
.seed-wrap input::-webkit-inner-spin-button{opacity:.4}

.btn{
  padding:7px 16px;border-radius:var(--rs);border:none;cursor:pointer;
  font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;
  transition:all .15s;white-space:nowrap;letter-spacing:.02em;
}
.btn-gold{background:var(--gold);color:#080a10}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(240,180,41,.3)}
.btn-teal{background:var(--teal);color:#080a10}
.btn-teal:hover{background:var(--teal2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(6,214,160,.3)}

/* ── STATS BAR ─────────────── */
.stats-bar{
  display:flex;
  background:var(--surf);
  border-bottom:1px solid var(--bdr);
  overflow-x:auto;
}
.stat-item{
  flex:1;min-width:90px;
  padding:10px 18px;
  border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;gap:3px;
  position:relative;overflow:hidden;
}
.stat-item::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--bdr2);
}
.stat-item.ok::before{background:linear-gradient(90deg,var(--teal),transparent)}
.stat-item.warn::before{background:linear-gradient(90deg,var(--warn),transparent)}
.stat-item.err::before{background:linear-gradient(90deg,var(--err),transparent)}
.stat-item.bl::before{background:linear-gradient(90deg,var(--blue),transparent)}
.stat-item:last-child{border-right:none}
.stat-val{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--gold);line-height:1}
.stat-val.ok{color:var(--ok)}
.stat-val.err{color:var(--err)}
.stat-val.bl{color:var(--blue2)}
.stat-val.mo{font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--txt2)}
.stat-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt3);font-weight:600}

/* ── TABS ─────────────────── */
.tabs{
  display:flex;
  background:var(--surf);
  border-bottom:1px solid var(--bdr);
  padding:0 24px;
  gap:4px;
}
.tab{
  padding:10px 18px;
  border:none;border-bottom:2px solid transparent;
  background:transparent;
  color:var(--txt2);
  font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;
  cursor:pointer;transition:all .2s;
  letter-spacing:.04em;text-transform:uppercase;
}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}

/* ── CONTROLS ─────────────── */
.ctrls{
  display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;
  padding:12px 24px;
  background:var(--surf);
  border-bottom:1px solid var(--bdr);
}
.cg{display:flex;flex-direction:column;gap:4px}
.cg label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--txt3)}
select{
  background:var(--surf2);
  border:1px solid var(--bdr2);
  border-radius:var(--rs);
  color:var(--txt);
  padding:7px 12px;
  font-family:'Instrument Sans',sans-serif;
  font-size:.82rem;
  min-width:160px;cursor:pointer;outline:none;
  transition:border-color .15s;
}
select:focus{border-color:var(--gold)}

/* ── LEGEND ─────────────── */
.legend{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:10px 24px;
  background:var(--surf);
  border-bottom:1px solid var(--bdr);
}
.leg-item{display:flex;align-items:center;gap:5px;font-size:.67rem;color:var(--txt2);font-weight:500}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── MAIN ─────────────────── */
.main{padding:20px 24px}

/* ── BELL SCHEDULE BANNER ─── */
.bell-banner{
  background:var(--surf2);
  border:1px solid var(--bdr2);
  border-radius:var(--r);
  padding:14px 18px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.bell-title{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.bell-times{display:flex;gap:10px;flex-wrap:wrap}
.bell-chip{
  background:var(--surf3);
  border:1px solid var(--bdr);
  border-radius:4px;
  padding:3px 9px;
  font-family:'JetBrains Mono',monospace;
  font-size:.65rem;
  color:var(--txt2);
}
.bell-chip span{color:var(--gold2);font-weight:600}

/* ── TABLE WRAPPER ────────── */
.tw{
  overflow-x:auto;
  border-radius:var(--r);
  border:1px solid var(--bdr);
  background:var(--surf);
}
table.tt{
  border-collapse:collapse;
  width:100%;min-width:780px;
  font-size:.77rem;
}
table.tt th{
  background:var(--surf3);
  color:var(--txt3);
  padding:9px 12px;
  text-align:left;
  font-weight:700;
  font-size:.62rem;
  text-transform:uppercase;
  letter-spacing:.09em;
  border-bottom:1px solid var(--bdr2);
  white-space:nowrap;
  font-family:'Syne',sans-serif;
}
table.tt th.dh{color:var(--gold2);text-align:center}
table.tt td{
  border:1px solid var(--bdr);
  padding:0;vertical-align:top;min-width:116px;
}
.pc{
  background:var(--surf3)!important;
  padding:9px 12px;
  font-family:'JetBrains Mono',monospace;
  vertical-align:middle;
  white-space:nowrap;
  min-width:110px;
  border-right:2px solid var(--bdr2)!important;
}
.pc .pn{font-size:.82rem;font-weight:600;color:var(--txt);display:block}
.pc .pt{font-size:.6rem;color:var(--txt3);display:block;margin-top:2px}

/* ── CELLS ───────────────── */
.cell{
  padding:7px 9px;
  min-height:54px;
  display:flex;flex-direction:column;
  justify-content:center;gap:3px;
  transition:filter .12s,transform .1s;
  cursor:default;
  position:relative;
}
.cell:hover{filter:brightness(1.12);z-index:2}
.cs{font-weight:700;font-size:.76rem;color:rgba(0,0,0,.85);line-height:1.2;font-family:'Syne',sans-serif}
.ct2{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:rgba(0,0,0,.5);font-weight:500}
.cex{
  display:inline-block;
  font-size:.52rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  background:rgba(0,0,0,.18);color:rgba(0,0,0,.6);
  border-radius:3px;padding:1px 4px;margin-top:2px;align-self:flex-start;
  font-family:'JetBrains Mono',monospace;
}
.cb{background:#10121a!important}
.cb .cs{color:var(--txt3)!important;font-style:italic;font-size:.7rem;font-weight:400;font-family:'Instrument Sans',sans-serif}
.cnil{background:var(--surf)!important}
.cnil .cs{color:var(--txt3)!important;font-weight:400}
.cell-combo{
  position:absolute;top:3px;right:3px;
  font-size:.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(0,0,0,.25);color:rgba(0,0,0,.7);
  border-radius:3px;padding:1px 4px;
  font-family:'JetBrains Mono',monospace;
}

/* ── SUMMARY STRIP ────────── */
.tsumm{
  padding:10px 16px;
  background:var(--surf2);
  border:1px solid var(--bdr2);
  border-radius:var(--r);
  margin-bottom:14px;
  font-size:.8rem;color:var(--txt2);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}
.tsumm strong{color:var(--txt);font-family:'Syne',sans-serif}
.badge{
  background:var(--surf3);
  border:1px solid var(--bdr2);
  border-radius:4px;
  padding:2px 8px;
  font-size:.66rem;
  font-family:'JetBrains Mono',monospace;
  color:var(--gold);
}

/* ── LOG ─────────────────── */
.log{
  margin-top:18px;
  background:var(--surf);
  border:1px solid var(--bdr);
  border-radius:var(--r);
  overflow:hidden;
}
.lhdr{
  padding:9px 16px;
  background:var(--surf2);
  border-bottom:1px solid var(--bdr);
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--txt3);
  display:flex;justify-content:space-between;
  font-family:'Syne',sans-serif;
}
.lbod{max-height:220px;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.li2{
  padding:3px 10px;border-radius:3px;
  font-family:'JetBrains Mono',monospace;font-size:.68rem;
  color:var(--txt2);background:var(--bg);
  border-left:3px solid transparent;
}
.li2.ok{border-color:var(--ok);color:var(--ok)}
.li2.warn{border-color:var(--warn);color:var(--warn)}
.li2.err{border-color:var(--err);color:#ff9eb0}

/* ── SCROLLBAR ─────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}

/* ── DIVIDER ─────────────── */
.section-divider{
  display:flex;align-items:center;gap:12px;
  padding:10px 24px;
  background:var(--surf);
  border-bottom:1px solid var(--bdr);
  font-family:'JetBrains Mono',monospace;
  font-size:.65rem;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.12em;
}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}
</style>
</head>
<body>

<div id="loading">
  <div style="text-align:center">
    <div class="load-logo">Master Timetable</div>
    <div class="load-sub" style="margin-top:6px">2026 – 27 Academic Year</div>
  </div>
  <div class="pw"><div class="pb" id="prog"></div></div>
  <div id="lmsg">Initialising…</div>
</div>

<div id="app" style="display:none">
<header>
  <div class="brand">
    <div class="brand-name">Master Timetable</div>
    <div class="brand-sub">2026 – 27</div>
  </div>
  <div class="hcontrols">
    <div class="seed-wrap">
      <label>🌱 Seed</label>
      <input type="number" id="seedInp" value="2627" min="1" max="999999" placeholder="e.g. 42"/>
    </div>
    <button class="btn btn-gold" onclick="regenerate()">↺ Generate</button>
    <button class="btn btn-teal" onclick="exportCSV()">⬇ Export CSV</button>
  </div>
</header>

<div class="stats-bar" id="stats"></div>

<div class="tabs">
  <button class="tab on" onclick="switchTab('div',this)">By Division</button>
  <button class="tab" onclick="switchTab('tch',this)">By Teacher</button>
  <button class="tab" onclick="switchTab('bell',this)">Bell Schedule</button>
</div>

<div class="ctrls" id="ctrlD">
  <div class="cg">
    <label>Division</label>
    <select id="selDiv" onchange="renderDiv()"></select>
  </div>
  <div class="cg">
    <label>Day</label>
    <select id="selDay" onchange="renderDiv()">
      <option value="all">All Days</option>
      <option value="0">Monday</option>
      <option value="1">Tuesday</option>
      <option value="2">Wednesday</option>
      <option value="3">Thursday</option>
      <option value="4">Friday</option>
      <option value="5">Saturday</option>
    </select>
  </div>
</div>

<div class="ctrls" id="ctrlT" style="display:none">
  <div class="cg">
    <label>Teacher</label>
    <select id="selTch" onchange="renderTch()"></select>
  </div>
</div>

<div class="legend" id="legend"></div>
<div id="view"></div>
</div>

<script>
// ── SEEDED RNG ────────────────────────────────────
let _S=2627;
function seedRng(s){_S=((s>>>0)||1)}
function rng(){_S^=_S<<13;_S^=_S>>17;_S^=_S<<5;return(_S>>>0)/4294967296}
function ri(n){return Math.floor(rng()*n)}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=ri(i+1);[r[i],r[j]]=[r[j],r[i]]}return r}

// ── DAYS ─────────────────────────────────────────
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// ── PERIOD DEFINITIONS ────────────────────────────
// Group B (Grades 3–10): 8 × 40-min periods
// Break: 10:20–10:30 | Lunch: 12:30–1:00 | School ends: 3:00
const PB_WD=[
  {id:'P1', s:'9:00', e:'9:40',  lb:'1st Period', dur:40},
  {id:'P2', s:'9:40', e:'10:20', lb:'2nd Period', dur:40},
  {id:'BK1',s:'10:20',e:'10:30', lb:'Short Break',isBreak:true},
  {id:'P3', s:'10:30',e:'11:10', lb:'3rd Period', dur:40},
  {id:'P4', s:'11:10',e:'11:50', lb:'4th Period', dur:40},
  {id:'P5', s:'11:50',e:'12:30', lb:'5th Period', dur:40},
  {id:'BK2',s:'12:30',e:'13:00', lb:'Lunch Break',isBreak:true},
  {id:'P6', s:'13:00',e:'13:40', lb:'6th Period', dur:40},
  {id:'P7', s:'13:40',e:'14:20', lb:'7th Period', dur:40},
  {id:'P8', s:'14:20',e:'15:00', lb:'8th Period', dur:40},
];
// Group A (Grades 1–2 & 11–12): 6 × 40-min periods, school ends 2:00
const PA_WD=[
  {id:'P1', s:'9:00', e:'9:40',  lb:'1st Period', dur:40},
  {id:'P2', s:'9:40', e:'10:20', lb:'2nd Period', dur:40},
  {id:'BK1',s:'10:20',e:'10:30', lb:'Short Break',isBreak:true},
  {id:'P3', s:'10:30',e:'11:10', lb:'3rd Period', dur:40},
  {id:'P4', s:'11:10',e:'11:50', lb:'4th Period', dur:40},
  {id:'P5', s:'11:50',e:'12:30', lb:'5th Period', dur:40},
  {id:'BK2',s:'12:30',e:'13:00', lb:'Lunch Break',isBreak:true},
  {id:'P6', s:'13:00',e:'13:40', lb:'6th Period', dur:40},
  {id:'ACT',s:'13:40',e:'14:00', lb:'Wrap-up / Dispersal',isAct:true},
];
// Saturday Group B: 6 periods (no P7/P8)
const PB_SAT=[
  {id:'P1', s:'9:00', e:'9:40',  lb:'Reading Activity',isRead:true,dur:40},
  {id:'P2', s:'9:40', e:'10:20', lb:'2nd Period', dur:40},
  {id:'BK1',s:'10:20',e:'10:30', lb:'Short Break',isBreak:true},
  {id:'P3', s:'10:30',e:'11:10', lb:'3rd Period', dur:40},
  {id:'P4', s:'11:10',e:'11:50', lb:'4th Period', dur:40},
  {id:'P5', s:'11:50',e:'12:30', lb:'5th Period', dur:40},
  {id:'BK2',s:'12:30',e:'13:00', lb:'Lunch Break',isBreak:true},
  {id:'P6', s:'13:00',e:'13:30', lb:'6th Period', dur:30},
];
// Saturday Group A
const PA_SAT=[
  {id:'P1', s:'9:00', e:'9:40',  lb:'Reading Activity',isRead:true,dur:40},
  {id:'P2', s:'9:40', e:'10:20', lb:'2nd Period', dur:40},
  {id:'BK1',s:'10:20',e:'10:30', lb:'Short Break',isBreak:true},
  {id:'P3', s:'10:30',e:'11:10', lb:'3rd Period', dur:40},
  {id:'P4', s:'11:10',e:'11:50', lb:'4th Period', dur:40},
];
function getPeriods(grp,sat){if(grp==='A')return sat?PA_SAT:PA_WD;return sat?PB_SAT:PB_WD}

// ── DIVISIONS ─────────────────────────────────────
const DIVS=[
  {id:'1S',g:1,n:'Grade 1-S',grp:'A'},{id:'1M',g:1,n:'Grade 1-M',grp:'A'},
  {id:'2S',g:2,n:'Grade 2-S',grp:'A'},{id:'2M',g:2,n:'Grade 2-M',grp:'A'},
  {id:'3S',g:3,n:'Grade 3-S',grp:'B'},{id:'3M',g:3,n:'Grade 3-M',grp:'B'},
  {id:'4S',g:4,n:'Grade 4-S',grp:'B'},
  {id:'5S',g:5,n:'Grade 5-S',grp:'B'},{id:'5M',g:5,n:'Grade 5-M',grp:'B'},
  {id:'6S',g:6,n:'Grade 6-S',grp:'B'},
  {id:'7S',g:7,n:'Grade 7-S',grp:'B'},{id:'7M',g:7,n:'Grade 7-M',grp:'B'},
  {id:'8S',g:8,n:'Grade 8-S',grp:'B'},{id:'8M',g:8,n:'Grade 8-M',grp:'B'},
  {id:'9',g:9,n:'Grade 9',grp:'B'},{id:'10',g:10,n:'Grade 10',grp:'B'},
  {id:'11',g:11,n:'Grade 11',grp:'A'},{id:'12',g:12,n:'Grade 12',grp:'A'},
];
const CT={
  '1S':'Bundele Miss','1M':'Vaishali Miss',
  '2S':'Prajakta Miss','2M':'Shobha Miss',
  '3S':'Shivali Miss','3M':'Jayashree Miss',
  '4S':'Ekta Miss',
  '5S':'Swapna Miss','5M':'Ashwini Miss',
  '6S':'Rathor Miss',
  '7S':'Sandip Sir','7M':'Kalpana Miss',
  '8S':'Shital Miss','8M':'Beauty Miss',
  '9':'Rushikant Sir','10':'Sudarshan Sir',
  '11':'Sayali Miss','12':'Priyanka Auti'
};

// ── COLOURS ─────────────────────────────────────
const SC={
  'English':'#5bb8f5',
  'Hindi':'#ff8c69',
  'Marathi':'#c77dff',
  'Maths':'#72d572',
  'EVS':'#b5d56a',
  'Science':'#4ecdc4',
  'Physics':'#74b9ff',
  'Chemistry':'#fda44f',
  'Biology':'#98d8a3',
  'S.St':'#f67280',
  'Computer/IT':'#7fe7e7',
  'PE':'#ffe066',
  'Phonics':'#c3a6ff',
  'Speaking Skills':'#d4a6ff',
  'Art':'#f9a8a8',
  'Dance & Gym':'#ff85c0',
  'Chess':'#c7b89a',
  'Cricket/BB/Bad':'#a8d8b0',
  'MPT':'#ffe599',

// ── CRICKET/BB SCHEDULE ──────────────────────────
// Grade 3 & 4 → Tuesday (P3 slot)
// Grade 5 & 6 → Wednesday (P3 slot)
// Grade 7       → Thursday (P3 slot)
// Grade 8       → Friday   (P3 slot)
const CRICKET_MAP={
  3:{day:1,pid:'P3'},
  4:{day:1,pid:'P3'},
  5:{day:2,pid:'P3'},
  6:{day:2,pid:'P3'},
  7:{day:3,pid:'P3'},
  8:{day:4,pid:'P3'},
};

// ── STATE ─────────────────────────────────────────
let SCH={},BUSY={},LOGS=[];

function initState(){
  SCH={};BUSY={};LOGS=[];
  for(const div of DIVS){
    SCH[div.id]={};
    for(let d=0;d<6;d++){
      const ps=getPeriods(div.grp,d===5);
      SCH[div.id][d]=ps.map(p=>({
        pid:p.id,lb:p.lb,s:p.s,e:p.e,
        subj:p.isBreak?'__BRK__':p.isRead?'Reading Activity':p.isAct?'__ACT__':null,
        tch:null,isBreak:!!p.isBreak,isRead:!!p.isRead,isAct:!!p.isAct,isExtra:false,isCombo:false
      }));
    }
  }
}

function getTcher(subj,grade,did){
  if(subj==='MPT')return CT[did]||'ClassTeacher';
  if(subj==='PT')return 'PT Teacher';
  if(subj==='PE'){if(grade===11)return 'Sayali Miss';if(grade===12)return 'Sudarshan Sir';return null}
  const m=TA.find(a=>a.s===subj&&a.g.includes(grade));return m?m.t:null;
}
function getAllowedDays(tch,subj){const m=TA.find(a=>a.t===tch&&a.s===subj);if(!m||!m.days)return[0,1,2,3,4,5];return m.days}
function isFree(t,d,pid){return!BUSY[t]?.[d]?.[pid]}
function markBusy(t,d,pid,did){if(!BUSY[t])BUSY[t]={};if(!BUSY[t][d])BUSY[t][d]={};BUSY[t][d][pid]=did}
function assign(did,d,idx,subj,tch,extra=false,combo=false){
  SCH[did][d][idx].subj=subj;
  SCH[did][d][idx].tch=tch;
  SCH[did][d][idx].isExtra=extra;
  SCH[did][d][idx].isCombo=combo;
  const pid=SCH[did][d][idx].pid;
  if(subj!=='MPT')markBusy(tch,d,pid,did);
}
function freeSlots(did,d){return SCH[did][d].map((s,i)=>({...s,i})).filter(s=>!s.isBreak&&!s.isAct&&!s.isRead&&s.subj===null)}
function cntW(did,subj){let c=0;for(let d=0;d<6;d++)c+=SCH[did][d].filter(s=>s.subj===subj).length;return c}
function cntD(did,d,subj){return SCH[did][d].filter(s=>s.subj===subj).length}

// ── SCHEDULER ────────────────────────────────────
function generate(){
  initState();

  // 1. MPT: Wednesday P1+P2 all divisions
  for(const div of DIVS){
    const d=2,ct=CT[div.id];
    const ps=getPeriods(div.grp,false);
    const i1=ps.findIndex(p=>p.id==='P1'),i2=ps.findIndex(p=>p.id==='P2');
    if(i1>=0)assign(div.id,d,i1,'MPT',ct);
    if(i2>=0)assign(div.id,d,i2,'MPT',ct);
  }

  // 2. Cricket/BB/Bad: fixed day+slot per grade group (combined lecture)
  for(const div of DIVS){
    const cm=CRICKET_MAP[div.g];if(!cm)continue;
    const{day,pid}=cm;
    const ps=getPeriods(div.grp,false);
    const idx=ps.findIndex(p=>p.id===pid);
    if(idx<0)continue;
    if(SCH[div.id][day][idx].subj!==null)continue;
    assign(div.id,day,idx,'Cricket/BB/Bad','Sports Teacher',false,true);
  }

  // 3. Saturday special subjects
  for(const div of DIVS){
    const d=5,ct=CT[div.id];
    if(div.g>=3&&div.g<=5){
      const idx=SCH[div.id][d].findIndex(s=>s.pid==='P2'&&s.subj===null);
      if(idx>=0)assign(div.id,d,idx,'Khel Yoga',ct);
    }
    if(div.g>=6&&div.g<=10){
      const i2=SCH[div.id][d].findIndex(s=>s.pid==='P2'&&s.subj===null);
      const i3=SCH[div.id][d].findIndex(s=>s.pid==='P3'&&s.subj===null);
      if(i2>=0)assign(div.id,d,i2,'Kushal Bodh',ct);
      if(i3>=0)assign(div.id,d,i3,'Khel Yatra',ct);
    }
  }

  // 4. Grade 11 & 12 P1 day-wise constraint
  // Grade 12: Mon–Wed P1=Maths, Thu–Fri P1=Bio
  // Grade 11: Mon–Wed P1=Bio,   Thu–Fri P1=Maths
  for(const div of DIVS){
    if(div.g!==11&&div.g!==12)continue;
    const ps=getPeriods(div.grp,false);
    const p1i=ps.findIndex(p=>p.id==='P1');
    if(p1i<0)continue;
    for(let d=0;d<5;d++){
      if(d===2)continue; // Wednesday = MPT already placed
      let subj;
      if(div.g===12){subj=(d<=1)?'Maths':'Biology'} // Mon(0),Tue(1)=Maths; Thu(3),Fri(4)=Bio
      else          {subj=(d<=1)?'Biology':'Maths'}  // Mon(0),Tue(1)=Bio;  Thu(3),Fri(4)=Maths
      // Wed is d=2 skipped (MPT). Mon=0,Tue=1,Thu=3,Fri=4
      if(d===3||d===4){
        if(div.g===12)subj='Biology';
        else subj='Maths';
      }
      if(SCH[div.id][d][p1i].subj!==null)continue;
      const tch=getTcher(subj,div.g,div.id);
      if(tch&&isFree(tch,d,'P1'))assign(div.id,d,p1i,subj,tch);
    }
  }

  // 5. Weekday P1 = class teacher subject (grades 1–10 only)
  for(const div of DIVS){
    if(div.g>=11)continue;
    const ct=CT[div.id];if(!ct)continue;
    const ctS=TA.filter(a=>a.t===ct&&a.g.includes(div.g)&&a.s!=='MPT'&&a.s!=='PT').map(a=>a.s);
    if(!ctS.length)continue;
    for(let d=0;d<5;d++){
      if(d===2)continue;
      const ps=getPeriods(div.grp,false);
      const p1i=ps.findIndex(p=>!p.isBreak&&!p.isAct);
      if(p1i<0)continue;
      const sl=SCH[div.id][d][p1i];if(sl.subj!==null)continue;
      const ranked=[...ctS].sort((a,b)=>cntW(div.id,a)-cntW(div.id,b));
      for(const subj of ranked){
        const need=SESS[div.id]?.[subj]||0;
        if(cntW(div.id,subj)>=need)continue;
        if(cntD(div.id,d,subj)>0)continue;
        const ad=getAllowedDays(ct,subj);if(!ad.includes(d))continue;
        if(isFree(ct,d,sl.pid)){assign(div.id,d,p1i,subj,ct);break}
      }
      if(SCH[div.id][d][p1i].subj===null){
        for(const subj of ranked){
          if(cntW(div.id,subj)>=(SESS[div.id]?.[subj]||0))continue;
          if(isFree(ct,d,sl.pid)){assign(div.id,d,p1i,subj,ct);break}
        }
      }
    }
  }

  // 6. Build task list
  const tDC={};for(const a of TA)tDC[a.t]=(tDC[a.t]||0)+a.g.length;
  let tasks=[];
  for(const div of DIVS){
    for(const[subj,total]of Object.entries(SESS[div.id]||{})){
      if(subj==='MPT'||subj==='PT'||subj==='Cricket/BB/Bad')continue;
      const tch=getTcher(subj,div.g,div.id);if(!tch)continue;
      tasks.push({did:div.id,g:div.g,subj,tch,total,pri:tDC[tch]||1});
    }
  }
  tasks=shuffleByPri(tasks);

  // 7. Place required sessions (Bio for 11/12 only in P1-P3)
  for(let pass=0;pass<12;pass++){
    let any=false;
    for(const tk of tasks){
      const{did,g,subj,tch,total}=tk;
      if(cntW(did,subj)>=total)continue;
      const ad=getAllowedDays(tch,subj);
      const dord=dayOrd(did,subj,ad);
      let placed=false;
      for(const d of dord){
        if(d===5&&!SAT_OK.has(subj))continue;
        if(!ad.includes(d))continue;
        const mx=total<=6?1:2;if(cntD(did,d,subj)>=mx)continue;
        const fs=freeSlots(did,d);if(!fs.length)continue;
        for(const sl of sortSl(fs,subj,g)){
          if(!isAllowed(did,g,subj,d,sl.pid))continue;
          if(isFree(tch,d,sl.pid)){assign(did,d,sl.i,subj,tch);placed=true;any=true;break}
        }
        if(placed)break;
      }
      if(!placed){
        for(let d=0;d<6;d++){
          if(d===5&&!SAT_OK.has(subj))continue;
          if(!ad.includes(d))continue;
          for(const sl of freeSlots(did,d)){
            if(!isAllowed(did,g,subj,d,sl.pid))continue;
            if(isFree(tch,d,sl.pid)){assign(did,d,sl.i,subj,tch);placed=true;any=true;break}
          }
          if(placed)break;
        }
      }
    }
    if(!any)break;
  }

  // 8. PT: exactly 1 per division (grades 1–10)
  for(const div of DIVS){
    if(div.g>10)continue;
    let done=0;
    for(const d of shuffle([0,1,2,3,4,5])){
      if(done>=1)break;
      for(const sl of shuffle(freeSlots(div.id,d))){
        if(done>=1)break;
        if(isFree('PT Teacher',d,sl.pid)){assign(div.id,d,sl.i,'PT','PT Teacher');done++;break}
      }
    }
  }

  // 9. Fill empty slots (extra)
  for(const div of DIVS){
    for(let d=0;d<6;d++){
      for(const sl of freeSlots(div.id,d)){
        for(const subj of FILL){
          if(d===5&&!SAT_OK.has(subj))continue;
          if(!SESS[div.id]?.[subj])continue;
          const tch=getTcher(subj,div.g,div.id);if(!tch)continue;
          const ad=getAllowedDays(tch,subj);if(!ad.includes(d))continue;
          if(cntD(div.id,d,subj)>=2)continue;
          if(!isAllowed(div.id,div.g,subj,d,sl.pid))continue;
          if(isFree(tch,d,sl.pid)){assign(div.id,d,sl.i,subj,tch,true);break}
        }
      }
    }
  }

  validate();
}

// Bio for 11/12: only P1, P2, P3
function isAllowed(did,g,subj,d,pid){
  if((g===11||g===12)&&subj==='Biology'){
    return['P1','P2','P3'].includes(pid);
  }
  return true;
}

function shuffleByPri(tasks){
  const byP={};for(const t of tasks)(byP[t.pri]=byP[t.pri]||[]).push(t);
  let out=[];for(const p of Object.keys(byP).map(Number).sort((a,b)=>b-a))out=[...out,...shuffle(byP[p])];
  return out;
}
function dayOrd(did,subj,ad){
  const arr=[];
  for(let d=0;d<6;d++){if(!ad.includes(d))continue;arr.push({d,cnt:cntD(did,d,subj),fr:freeSlots(did,d).length})}
  arr.sort((a,b)=>a.cnt-b.cnt||b.fr-a.fr);
  const g={};for(const x of arr)(g[x.cnt]=g[x.cnt]||[]).push(x);
  let out=[];for(const k of Object.keys(g).sort((a,b)=>a-b))out=[...out,...shuffle(g[k])];
  return out.map(x=>x.d);
}
function sortSl(slots,subj,grade){
  const ac=new Set(['Maths','English','Hindi','Marathi','Physics','Chemistry','Biology','Science','EVS','S.St']);
  // Bio for 11/12 must be in first 3 slots → sort by slot index ascending
  if((grade===11||grade===12)&&subj==='Biology')return[...slots].sort((a,b)=>a.i-b.i);
  if(ac.has(subj))return[...slots].sort((a,b)=>a.i-b.i);
  return shuffle(slots);
}

function validate(){
  LOGS=[];let need=0,done=0,conf=0;
  for(const[tch,days]of Object.entries(BUSY)){
    for(let d=0;d<6;d++){
      if(!days[d])continue;
      const seen={};
      for(const pid of Object.keys(days[d])){if(seen[pid]){LOGS.push({t:'err',m:`CONFLICT: ${tch} ${DAYS[d]} ${pid}`});conf++}seen[pid]=true}
    }
  }
  for(const div of DIVS){
    for(const[subj,n]of Object.entries(SESS[div.id]||{})){
      need+=n;const got=cntW(div.id,subj);done+=Math.min(got,n);
      if(got<n)LOGS.push({t:'warn',m:`${div.n}: ${subj} ${got}/${n}`});
    }
  }
  const pct=Math.round(done/need*100);
  LOGS.unshift({t:'ok',m:`Completeness: ${done}/${need} (${pct}%)`});
  LOGS.unshift(conf===0?{t:'ok',m:'No teacher conflicts ✓'}:{t:'err',m:`${conf} conflict(s) found`});
}

// ── RENDERING ────────────────────────────────────
function cellH(sl){
  if(sl.isBreak)return`<div class="cell cb"><span class="cs">${sl.lb}</span></div>`;
  if(sl.isAct)return`<div class="cell cb"><span class="cs">Wrap-up / Dispersal</span></div>`;
  if(sl.isRead||sl.subj==='Reading Activity')return`<div class="cell" style="background:${SC['Reading Activity']}"><span class="cs">Reading Activity</span><span class="ct2">All — Assembly Hall</span></div>`;
  if(!sl.subj)return`<div class="cell cnil"><span class="cs" style="color:var(--txt3)">—</span></div>`;
  const bg=SC[sl.subj]||'#4a5070';
  return`<div class="cell" style="background:${bg}">
    ${sl.isCombo?`<span class="cell-combo">combined</span>`:''}
    <span class="cs">${sl.subj}</span>
    ${sl.tch?`<span class="ct2">${sl.tch}</span>`:''}
    ${sl.isExtra?`<span class="cex">extra</span>`:''}
  </div>`;
}

let curTab='div';
function switchTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  document.getElementById('ctrlD').style.display=(tab==='div')?'flex':'none';
  document.getElementById('ctrlT').style.display=(tab==='tch')?'flex':'none';
  document.getElementById('legend').style.display=(tab==='bell')?'none':'flex';
  if(tab==='div')renderDiv();
  else if(tab==='tch')renderTch();
  else renderBell();
}

function renderDiv(){
  const did=document.getElementById('selDiv').value;
  const dv=document.getElementById('selDay').value;
  const div=DIVS.find(x=>x.id===did);if(!div)return;
  const days=dv==='all'?[0,1,2,3,4,5]:[+dv];
  let html='';
  if(days.length===1){
    const d=days[0];
    html+=`<div class="tw"><table class="tt"><thead><tr><th>Period / Time</th><th class="dh">${DAYS[d]}</th><th>Teacher</th></tr></thead><tbody>`;
    for(const sl of SCH[did][d]){
      const bg=(!sl.isBreak&&!sl.isAct&&sl.subj&&!sl.isRead)?SC[sl.subj]||'#4a5070':'transparent';
      html+=`<tr><td class="pc"><span class="pn">${sl.lb}</span><span class="pt">${sl.s}–${sl.e}</span></td><td>${cellH(sl)}</td><td><div class="cell" style="background:${bg}"><span class="cs" style="font-weight:400;font-size:.74rem;color:rgba(0,0,0,.78)">${(!sl.isBreak&&!sl.isAct&&sl.subj&&!sl.isRead)?(sl.tch||'—'):''}</span></div></td></tr>`;
    }
    html+=`</tbody></table></div>`;
  } else {
    const maxL=Math.max(...days.map(d=>SCH[did][d].length));
    html+=`<div class="tw"><table class="tt"><thead><tr><th>Period / Time</th>${days.map(d=>`<th class="dh">${DAYS[d]}</th>`).join('')}</tr></thead><tbody>`;
    for(let pi=0;pi<maxL;pi++){
      const ref=SCH[did][days[0]][pi]||SCH[did][days[1]]?.[pi];if(!ref)continue;
      html+=`<tr><td class="pc"><span class="pn">${ref.lb}</span><span class="pt">${ref.s}–${ref.e}</span></td>`;
      for(const d of days){const sl=SCH[did][d][pi];html+=`<td>${sl?cellH(sl):'<div class="cell cnil"></div>'}</td>`}
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
  }
  html+=logH();
  document.getElementById('view').innerHTML=`<div class="main">${html}</div>`;
}

function renderTch(){
  const tch=document.getElementById('selTch').value;if(!tch)return;
  const byDay={};const pidT={};let tot=0;const divs=new Set();
  for(let d=0;d<6;d++){byDay[d]={};for(const div of DIVS)for(const sl of SCH[div.id][d])if(sl.tch===tch&&!sl.isBreak){byDay[d][sl.pid]={...sl,dn:div.n};pidT[sl.pid]=sl.s+'–'+sl.e;tot++;divs.add(div.n)}}
  const pids=['P1','P2','P3','P4','P5','P6','P7','P8'];
  const plb={'P1':'1st','P2':'2nd','P3':'3rd','P4':'4th','P5':'5th','P6':'6th','P7':'7th','P8':'8th'};
  let html=`<div class="tsumm"><strong>${tch}</strong><span>${tot} sessions/week</span><span>Classes: ${[...divs].join(', ')}</span><span class="badge">Seed ${_S}</span></div>`;
  html+=`<div class="tw"><table class="tt"><thead><tr><th>Period</th>${DAYS.map(d=>`<th class="dh">${d}</th>`).join('')}</tr></thead><tbody>`;
  for(const pid of pids){

}

function logH(){
  const items=LOGS.slice(0,60);
  return`<div class="log"><div class="lhdr"><span>Schedule Log</span><span style="color:var(--txt3);font-size:.65rem;font-family:'JetBrains Mono',monospace">${items.length} entries</span></div><div class="lbod">${items.map(l=>`<div class="li2 ${l.t}">${l.m}</div>`).join('')}</div></div>`;
}

function renderLegend(){

}

function renderStats(){
  let need=0,done=0,extras=0,conf=0;
  for(const div of DIVS){
    for(const[s,n]of Object.entries(SESS[div.id]||{})){need+=n;done+=Math.min(cntW(div.id,s),n)}
    for(let d=0;d<6;d++)extras+=SCH[div.id][d].filter(s=>s.isExtra).length
  }
  conf=LOGS.filter(l=>l.t==='err'&&l.m.includes('CONFLICT')).length;
  const pct=Math.round(done/need*100);
  document.getElementById('stats').innerHTML=`
    <div class="stat-item"><div class="stat-val">${DIVS.length}</div><div class="stat-lbl">Divisions</div></div>
    <div class="stat-item bl"><div class="stat-val bl">${Object.keys(BUSY).length}</div><div class="stat-lbl">Teachers</div></div>
    <div class="stat-item"><div class="stat-val">${done}</div><div class="stat-lbl">Sessions Placed</div></div>
    <div class="stat-item ${pct>=95?'ok':pct>=80?'warn':'err'}"><div class="stat-val ${pct>=95?'ok':pct>=80?'':'err'}">${pct}%</div><div class="stat-lbl">Completeness</div></div>
    <div class="stat-item ${conf===0?'ok':'err'}"><div class="stat-val ${conf===0?'ok':'err'}">${conf}</div><div class="stat-lbl">Conflicts</div></div>
    <div class="stat-item"><div class="stat-val bl">${extras}</div><div class="stat-lbl">Extra Slots</div></div>
    <div class="stat-item"><div class="stat-val mo">${_S}</div><div class="stat-lbl">Active Seed</div></div>`;
}

function populateSels(){
  document.getElementById('selDiv').innerHTML=DIVS.map(d=>`<option value="${d.id}">${d.n}</option>`).join('');
  const ts=[...new Set(TA.map(a=>a.t))].sort();if(!ts.includes('PT Teacher'))ts.push('PT Teacher');
  document.getElementById('selTch').innerHTML=ts.map(t=>`<option value="${t}">${t}</option>`).join('');
}

function exportCSV(){
  let csv=`School Master Timetable 2026-27\nSeed: ${_S}\n\n`;
  for(const div of DIVS){
    csv+=`\n=== ${div.n} ===\nPeriod,Time,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday\n`;
    const maxL=Math.max(...[0,1,2,3,4,5].map(d=>SCH[div.id][d].length));
    for(let pi=0;pi<maxL;pi++){
      const ref=SCH[div.id][0][pi]||SCH[div.id][1]?.[pi];if(!ref)continue;
      const row=[ref.lb,`${ref.s}-${ref.e}`];
      for(let d=0;d<6;d++){
        const sl=SCH[div.id][d][pi];
        if(!sl){row.push('');continue}
        if(sl.isBreak){row.push(sl.lb);continue}
        if(sl.isAct){row.push('Wrap-up / Dispersal');continue}
        row.push(sl.subj?(sl.subj+(sl.tch?' ('+sl.tch+')':'')+(sl.isExtra?' [EXTRA]':'')+(sl.isCombo?' [COMBINED]':'')):'');
      }
      csv+=row.map(c=>`"${(c||'').replace(/"/g,'""')}"`).join(',')+'\n';
    }
  }
  csv+=`\n\n=== TEACHER SCHEDULES ===\n`;
  const allT=[...new Set(TA.map(a=>a.t)),'PT Teacher'];
  for(const t of allT){
    csv+=`\n--- ${t} ---\nDay,Period,Time,Division,Subject,Extra\n`;
    for(let d=0;d<6;d++)for(const div of DIVS)for(const sl of SCH[div.id][d])
      if(sl.tch===t&&!sl.isBreak)csv+=`"${DAYS[d]}","${sl.lb}","${sl.s}-${sl.e}","${div.n}","${sl.subj||''}","${sl.isExtra?'YES':''}"\n`;
  }
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`TT_seed${_S}_2026-27.csv`;a.click();
}

function regenerate(){
  const sv=parseInt(document.getElementById('seedInp').value)||2627;
  seedRng(sv);generate();populateSels();renderLegend();renderStats();
  if(curTab==='div')renderDiv();
  else if(curTab==='tch')renderTch();
  else renderBell();
}

function boot(){
  const bar=document.getElementById('prog');
  const msgs=[
    'Loading teacher assignments…',
    'Building period slots…',
    'Placing MPT — Wed P1+P2…',
    'Fixing Cricket/Sports slots…',
    'Applying Gr.11/12 constraints…',
    'Scheduling all sessions…',
    'Placing PT sessions…',
    'Filling extra slots with core subjects…',
    'Validating schedule…',
  ];
  let pct=0,mi=0;
  const iv=setInterval(()=>{
    pct=Math.min(pct+ri(14)+6,92);
    bar.style.width=pct+'%';
    if(mi<msgs.length)document.getElementById('lmsg').textContent=msgs[mi++];
    if(pct>=92){
      clearInterval(iv);
      setTimeout(()=>{
        bar.style.width='100%';
        setTimeout(()=>{
          const sv=parseInt(document.getElementById('seedInp').value)||2627;
          seedRng(sv);generate();populateSels();renderLegend();renderStats();renderDiv();
          document.getElementById('loading').style.display='none';
          document.getElementById('app').style.display='block';
        },200);
      },150);
    }
  },155);
}
window.addEventListener('DOMContentLoaded',boot);
